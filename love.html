<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEGIS AI - Love Proposal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  height:100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffecd2 100%);
  overflow-x: hidden;
  color: #333;
}
.container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px;
  text-align: center;
}

/* ---------- Animated Love Stickers ---------- */
.sticker {
  position: absolute;
  font-size: 2rem;
  pointer-events: none;
  opacity: 0;
  animation: floatSticker linear infinite;
  z-index: 0;
}
@keyframes floatSticker {
  0% { transform: translateY(0) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
}

/* ---------- Login Card ---------- */
.login-card {
  background: rgba(255,255,255,0.9);
  padding: 40px 30px;
  border-radius: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  max-width: 400px;
  width: 100%;
  position: relative;
  z-index: 10;
  backdrop-filter: blur(10px);
  border: 3px solid #ff69b4;
}
.login-card h1 {
  font-size: 28px;
  margin-bottom: 10px;
  color: #d63384;
}
.login-card p {
  color: #666;
  margin-bottom: 25px;
  font-size: 15px;
}
.input-group { margin-bottom: 18px; text-align:left; }
.input-group label {
  display:block;
  font-size: 14px;
  margin-bottom: 6px;
  color: #d63384;
  font-weight: 600;
}
.input-group input {
  width: 100%;
  padding: 14px;
  border: 2px solid #ffb7c5;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  background: #fff0f5;
}
.input-group input:focus { border-color: #ff69b4; background:#fff; }
.btn-submit {
  width: 100%;
  padding: 14px;
  background: #ff69b4;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,105,180,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-submit:active { transform: scale(0.96); box-shadow: none; }
.btn-submit:hover { background: #e54aa3; }

/* ---------- Game Screen ---------- */
.game { display:none; max-width: 420px; width:100%; z-index:10; position:relative; }
.game h2 {
  font-size: 26px;
  color: #d63384;
  margin-bottom: 6px;
}
.tap-counter {
  font-size: 16px;
  color: #666;
  margin-bottom: 20px;
  font-weight: 600;
}

/* Tap target */
.tap-heart {
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s;
  margin-bottom: 20px;
  display: inline-block;
}
.tap-heart:active { transform: scale(1.4); }

/* Question card */
.question-card {
  background: rgba(255,255,255,0.95);
  padding: 30px 24px;
  border-radius: 24px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.12);
  border: 3px solid #ffb7c5;
  margin-bottom: 20px;
}
.question-card h3 {
  font-size: 20px;
  margin-bottom: 18px;
  line-height: 1.4;
  color: #444;
}
.q-options { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.q-btn {
  padding: 12px 24px;
  border-radius: 14px;
  border: 2px solid #ffb7c5;
  background: #fff;
  color: #d63384;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.q-btn.yes { background:#d63384; color:#fff; border-color:#d63384; }
.q-btn.yes:hover { background:#c2185b; }
.q-btn.no {
  background: #3b82f6;
  color: #fff;
  border-color: #2563eb;
}
.q-btn.no:hover {
  background: #2563eb;
  transform: scale(1.05);
}

/* Favourite dish input */
.text-answer { margin-top:14px; }
.text-answer input {
  padding: 12px;
  width: 70%;
  max-width: 220px;
  border: 2px solid #ffb7c5;
  border-radius: 12px;
  font-size: 15px;
  text-align: center;
}

/* Final result */
.hidden { display:none !important; }
.result-card {
  background: rgba(255,255,255,0.95);
  padding: 35px 24px;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border: 3px solid #d63384;
  animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  0% { transform: scale(0.5); opacity:0; }
  100% { transform: scale(1); opacity:1; }
}
.result-card h2 { font-size: 28px; color: #d63384; margin-bottom: 10px; }
.result-card p { font-size: 18px; color: #555; margin-bottom: 20px; }

/* ---------- Run-away No button ---------- */
.run-btn {
  position: absolute;
  transition: none;
}

/* Confetti */
.confetti {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 50;
}
.confetti-piece {
  position: absolute;
  width: 10px; height: 10px;
  background: #ff69b4;
  animation: fall linear infinite;
}
@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(720deg); }
}

@media (max-width: 480px) {
  .login-card, .game { padding: 25px 18px; }
  .q-btn { width: 45%; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Login Screen -->
  <div class="login-card" id="loginScreen">
    <h1>💌 Love Login</h1>
    <p>Enter your email to open the proposal</p>
    <div class="input-group">
      <label for="email">Your Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <button class="btn-submit" id="loginBtn">Continue to Love ❤️</button>
  </div>

  <!-- Game Screen -->
  <div class="game" id="gameScreen">
    <div class="tap-counter" id="counter">Tap the heart 10 times to start: <span id="tapCount">0</span>/10</div>
    <div class="tap-heart" id="tapHeart">💖</div>

    <div class="question-card" id="questionCard" style="display:none;">
      <h3 id="qText">Do you love me?</h3>
      <div class="q-options">
        <button class="q-btn yes" id="btnYes">Yes ✅</button>
        <button class="q-btn no run-btn" id="btnNo">❌</button>
      </div>
      <div class="text-answer" id="textAnswer" style="display:none;">
        <input type="text" id="textInput" placeholder="Type your answer...">
      </div>
    </div>

    <div class="result-card hidden" id="resultScreen">
      <h2>💞 You're Mine Now! 💞</h2>
      <p>Thank you for saying YES to all my love questions!</p>
      <p style="font-size:14px; color:#888;">(This is just a fun joke proposal 😉)</p>
    </div>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<script>
/* ---------- Love Sticker Animation Spawner ---------- */
const stickers = ['💘','💝','💖','💗','💓','💕','💞','💟','🌹','🍬','🎀','✨'];
function spawnSticker() {
  const s = document.createElement('div');
  s.className = 'sticker';
  s.textContent = stickers[Math.floor(Math.random()*stickers.length)];
  s.style.left = Math.random()*100 + 'vw';
  s.style.fontSize = (16 + Math.random()*30) + 'px';
  s.style.animationDuration = (3 + Math.random()*5) + 's';
  s.style.animationDelay = Math.random()*2 + 's';
  document.body.appendChild(s);
  setTimeout(()=> s.remove(), 8000);
}
setInterval(spawnSticker, 350);

/* ---------- Login ---------- */
document.getElementById('loginBtn').addEventListener('click', function(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if(!email){ alert('Please enter your email first!'); return; }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  startGame();
});

/* ---------- Game Logic ---------- */
let taps = 0;
let qIndex = 0;

const questions = [
  { q: "Do you love me? 💕", type: "yn" },
  { q: "What's your favourite dish? 🍕", type: "text" },
  { q: "Would you like to go for a date with me? 🍷", type: "yn" },
  { q: "Do you miss me? 😔", type: "yn" },
  { q: "Am I your favourite person? ✨", type: "yn" },
  { q: "Do I make you smile every day? 😊", type: "yn" },
  { q: "Should we cuddle all weekend? 🛏️", type: "yn" },
  { q: "Will you be my valentine forever? 💘", type: "yn" },
  { q: "Do you want to spend your life with me? 💍", type: "yn" },
  { q: "Will you marry me? 👰🤵", type: "yn" }
];

function startGame(){
  const tapHeart = document.getElementById('tapHeart');
  const counter = document.getElementById('counter');
  const tapCount = document.getElementById('tapCount');
  const qCard = document.getElementById('questionCard');

  tapHeart.addEventListener('click', function(){
    taps++;
    tapCount.textContent = taps;
    this.style.transform = 'scale(1.3)';
    setTimeout(()=> this.style.transform='scale(1)', 100);
    if(taps >= 10){
      counter.style.display = 'none';
      tapHeart.style.display = 'none';
      qCard.style.display = 'block';
      loadQuestion();
    }
  });
}

function loadQuestion(){
  if(qIndex >= questions.length){
    showResult();
    return;
  }
  const q = questions[qIndex];
  document.getElementById('qText').textContent = q.q;
  const opts = document.querySelector('.q-options');
  const ta = document.getElementById('textAnswer');
  opts.style.display = 'flex';
  ta.style.display = 'none';

  if(q.type === 'text'){
    opts.style.display = 'none';
    ta.style.display = 'block';
    document.getElementById('textInput').value = '';
    document.getElementById('textInput').focus();
    // Auto accept text after short delay via enter handled below
    return;
  }

  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');

  // Reset No button position
  btnNo.style.position = 'absolute';
  btnNo.style.left = '150px';
  btnNo.style.top = '0px';

  btnYes.onclick = function(){
    qIndex++;
    loadQuestion();
  };

  btnNo.onmouseenter = function(){
    moveNoButton(btnNo);
  };

  // Allow Enter for text questions handled separately
}

function moveNoButton(btn){
  const container = document.getElementById('questionCard');
  const cRect = container.getBoundingClientRect();
  const bRect = btn.getBoundingClientRect();

  // Jump in small fixed steps so it stays visible and never gets lost
  const stepX = (Math.random() - 0.5) * 140;
  const stepY = (Math.random() - 0.5) * 140;

  let newX = (bRect.left - cRect.left) + stepX;
  let newY = (bRect.top - cRect.top) + stepY;

  // Clamp inside the question card so the button stays on screen
  newX = Math.max(10, Math.min(newX, cRect.width - bRect.width - 10));
  newY = Math.max(10, Math.min(newY, cRect.height - bRect.height - 10));

  btn.style.left = newX + 'px';
  btn.style.top = newY + 'px';
}

// Text answer submit on Enter
document.getElementById('textInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    qIndex++;
    loadQuestion();
  }
});

function showResult(){
  document.getElementById('questionCard').style.display = 'none';
  const result = document.getElementById('resultScreen');
  result.style.display = 'block';
  fireConfetti();
}

function fireConfetti(){
  const conf = document.getElementById('confetti');
  for(let i=0; i<60; i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = ['#ff69b4','#ff1493','#ffb7c5','#ff6b6b','#ffd1dc'][Math.floor(Math.random()*5)];
    p.style.animationDuration = (0.5 + Math.random()*1.5) + 's';
    p.style.animationDelay = Math.random()*0.5 + 's';
    conf.appendChild(p);
    setTimeout(()=> p.remove(), 2000);
  }
}
</script>

</body>
</html>
